# Dependency policy: SECURITY UPDATES ONLY.
#
# This repo is a sandbox/GenAI experiment, not under active development, so
# routine version-bump PRs are pure queue noise (17 were open at once).
# `open-pull-requests-limit: 0` disables Dependabot VERSION updates for each
# ecosystem below.
#
# Dependabot SECURITY updates are NOT affected: security PRs are exempt from
# this limit and do not count toward it, so advisories still open PRs.
# Repo-level Dependabot alerts + automated security fixes are enabled
# (they were off until 2026-08-04 — turning them on is what makes this
# security-only policy real rather than just silent).
#
# To resume version updates: raise the limits back above zero.
version: 2

updates:
  # Python deps (uv + pyproject.toml across the workspace).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels: [dependencies, python]
    commit-message:
      prefix: chore(deps)

  # GitHub Actions versions across .github/workflows/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels: [dependencies, ci]
    commit-message:
      prefix: chore(deps-ci)

  # Base image (Dockerfile FROM lines).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(deps-docker)

  # docker-compose service images (jaeger, prometheus, grafana, etc.)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(deps-compose)
